<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#264a3a" />
    <title>Offline | OpenMinistry</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf7ef;
        color: #233a2e;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #264a3a;
      }

      h1 {
        margin: 0 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: #5a6b60;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0 20px;
        background: #264a3a;
        color: #f6f1e4;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#f6f1e4"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 9h4" />
          <path d="M12 7v5" />
          <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
          <path d="m18 9 3.52 2.147a1 1 0 0 1 .48.854V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6.999a1 1 0 0 1 .48-.854L6 9" />
          <path d="M6 21V7a1 1 0 0 1 .376-.782l5-3.999a1 1 0 0 1 1.249.001l5 4A1 1 0 0 1 18 7v14" />
        </svg>
      </div>
      <h1>Você está offline</h1>
      <p>
        O OpenMinistry precisa de conexão para mostrar a agenda e as escalas
        atualizadas. Verifique sua internet e tente de novo.
      </p>
      <a href="/dashboard">Tentar novamente</a>
    </main>
  </body>
</html>
